<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalBite</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,sans-serif}header{background:#172033;color:white;padding:24px max(20px,calc((100% - 960px)/2))}main{max-width:960px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid #dfe6ef;border-radius:14px;padding:18px}button{background:#176b47;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.secondary{background:#e5eaf1;color:#172033}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.muted{color:#64748b;font-size:14px}#status{white-space:pre-wrap;color:#a33}
</style></head><body><header><h1>🍲 LocalBite</h1><p>A food delivery demo running on Amazon EKS</p></header><main>
<p class="muted">Development demo — no real payments or deliveries.</p><div class="grid">
<section class="card"><h2>Today's menu</h2><div id="menu">Loading…</div></section>
<section class="card"><h2>Your order</h2><label>Customer name</label><input id="customer" value="Demo Customer" maxlength="80"><ul id="cart"><li>Cart empty</li></ul><div class="row"><b id="total">Total: ₹0</b><button id="place">Place order</button></div><p class="muted">Orders are temporary and may disappear if Redis restarts.</p></section>
<section class="card"><h2>Recent orders</h2><button class="secondary" id="refresh">Refresh</button><div id="orders" class="muted">Loading…</div></section></div><p id="status" role="status"></p></main>
<script>
let items=[],cart={};const money=n=>'₹'+Number(n).toFixed(0);
async function api(url,opt={}){let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function renderCart(){let ul=document.querySelector('#cart');ul.innerHTML='';let total=0;if(!Object.keys(cart).length)ul.textContent='Cart empty';for(let [id,q] of Object.entries(cart)){let x=items.find(i=>i.id===id);if(!x)continue;total+=x.price*q;let li=document.createElement('li');li.textContent=`${x.name} × ${q} — ${money(x.price*q)} `;let b=document.createElement('button');b.className='secondary';b.textContent='−';b.onclick=()=>{if(q===1)delete cart[id];else cart[id]--;renderCart()};li.append(b);ul.append(li)}document.querySelector('#total').textContent='Total: '+money(total)}
async function menu(){let d=await api('/api/restaurants');items=d.items;let root=document.querySelector('#menu');root.innerHTML='<h3>'+d.restaurant.name+'</h3><p class="muted">'+d.restaurant.description+'</p>';for(let x of items){let row=document.createElement('div');row.className='row';let s=document.createElement('span');s.textContent=x.name+' · '+money(x.price);let b=document.createElement('button');b.textContent='Add';b.onclick=()=>{cart[x.id]=(cart[x.id]||0)+1;renderCart()};row.append(s,b);root.append(row)}}
async function orders(){let d=await api('/api/orders'),root=document.querySelector('#orders');root.innerHTML='';if(!d.orders.length){root.textContent='No orders yet';return}for(let o of d.orders){let p=document.createElement('p');p.textContent='#'+o.id.slice(0,8)+' · '+o.customer+' · '+money(o.total)+' · '+o.status;root.append(p)}}
document.querySelector('#place').onclick=async()=>{try{let body={customer:document.querySelector('#customer').value,items:Object.entries(cart).map(([id,quantity])=>({id,quantity}))};let d=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});cart={};renderCart();document.querySelector('#status').textContent='Order placed! ID: '+d.order.id;await orders()}catch(e){document.querySelector('#status').textContent=e.message}};
document.querySelector('#refresh').onclick=()=>orders().catch(e=>document.querySelector('#status').textContent=e.message);
(async()=>{try{await menu();await orders()}catch(e){document.querySelector('#status').textContent='Could not load app data: '+e.message}})();
</script></body></html>
