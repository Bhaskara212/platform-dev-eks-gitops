apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: food-delivery
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bhaskara212/platform-dev-eks-gitops.git
    targetRevision: main
    path: applications/food-delivery
  destination:
    server: https://kubernetes.default.svc
    namespace: food-delivery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
