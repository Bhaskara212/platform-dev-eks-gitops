
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitbucket
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://atlassian.github.io/data-center-helm-charts
      chart: bitbucket
      targetRevision: 2.0.15
      helm:
        releaseName: bitbucket
        valueFiles:
          - $values/clusters/platform-dev-eks/atlassian/values/bitbucket-values.yaml
    - repoURL: https://github.com/Bhaskara212/platform-dev-eks-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: atlassian
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
