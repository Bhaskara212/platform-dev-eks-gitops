apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer   # volume is created in the AZ where the pod lands
allowVolumeExpansion: true
reclaimPolicy: Delete                      # dev/PoC; use Retain for anything you care about
