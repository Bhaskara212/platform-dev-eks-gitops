# kube-prometheus-stack values - dev/PoC, internal only (all Services are ClusterIP, no Ingress).
fullnameOverride: kps          # -> svc kps-prometheus, kps-alertmanager

# ---------------- Prometheus ----------------
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # pick up ServiceMonitors/PodMonitors/Rules from any namespace, not only this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

# ---------------- Alertmanager ----------------
alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
  # PoC: no external receiver. Alerts are visible in the Alertmanager UI / Grafana.
  # To add Slack/email later, reference a Secret via alertmanager.alertmanagerSpec.configSecret.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
    receivers:
      - name: "null"

# ---------------- Grafana ----------------
grafana:
  fullnameOverride: grafana
  enabled: true
  service:
    type: ClusterIP
  admin:
    existingSecret: grafana-admin       # created out-of-band (never commit passwords to Git)
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes: [ReadWriteOnce]
    size: 5Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
  defaultDashboardsTimezone: Australia/Sydney
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL              # load dashboard ConfigMaps labelled grafana_dashboard=1 from any namespace

# ---------------- kube-state-metrics ----------------
kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }

# ---------------- node-exporter (DaemonSet) ----------------
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 64Mi }
  # hostNetwork/hostPID default to true; port 9100 between nodes is allowed by the node SG (self-all rule)

# ---------------- Operator ----------------
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# ---------------- EKS specifics ----------------
# EKS control plane is managed: these endpoints are not reachable, scraping them only yields DOWN targets/false alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
# kube-proxy metrics bind to 127.0.0.1 on EKS by default -> would be DOWN.
kubeProxy: { enabled: false }
coreDns: { enabled: true }
kubeApiServer: { enabled: true }
kubelet: { enabled: true }

# Alerts that are always noisy/meaningless on managed EKS
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false
