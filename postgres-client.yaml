apiVersion: v1
kind: Pod
metadata:
  name: postgres-client
  namespace: atlassian
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: postgres:15
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
