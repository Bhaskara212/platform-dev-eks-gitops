apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev-monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.7.0
      helm:
        releaseName: platform-dev
        valueFiles:
          - $values/clusters/platform-dev-eks/monitoring/values.yaml
    - repoURL: REPLACE_WITH_YOUR_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
